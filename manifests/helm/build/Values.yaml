# Generated by setup-secrets.sh on Thu Dec 18 10:25:20 IST 2025

sealedSecrets:
  # Registry credentials (docker config json)
  registry:
    enabled: true
    secretName: registry-credentials
    encryptedData: ""

  # Git credentials (username + token)
  git:
    enabled: true
    secretName: git-credentials
    encryptedData: |
      username: 
      token: 

  # ArgoCD credentials (username + password)
  argocd:
    enabled: true
    secretName: argocd-credentials
    encryptedData: |
      username: 
      password: 
