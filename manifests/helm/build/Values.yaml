# ===========================================
# Application Configuration
# ===========================================
app:
  name: ${{ values.component_id }}
  namespace: ${{ values.component_id }}-dev
  clusterDomain: ${{ values.cluster_domain }}

# ===========================================
# Git Repository Configuration
# ===========================================
git:
  branch: main
  repo: ${{ values.source_repository }}
  org: ${{ values.git_owner }}
  host: ${{ values.repository_host }}
  name: ${{ values.component_id }}

# ===========================================
# ArgoCD Configuration
# ===========================================
argocd:
  server: openshift-gitops-server-${{ values.argocd_namespace }}.${{ values.cluster_domain }}
  namespace: ${{ values.argocd_namespace }}

# ===========================================
# Image Registry Configuration
# ===========================================
image:
  host: ${{ values.image_host }}
  organization: ${{ values.image_organization }}
  name: ${{ values.image_name }}
  # Default tag for initial build - pipeline will tag with git SHA + latest
  tag: latest
# ===========================================


