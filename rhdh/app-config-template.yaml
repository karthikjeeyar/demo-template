kind: ConfigMap
apiVersion: v1
metadata:
  name: app-config-rhdh
  namespace: ${RHDH_NAMESPACE}
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://backstage-demo-${RHDH_NAMESPACE}.${CLUSTER_DOMAIN}

    backend:
      auth:
        keys:
          - secret: ${BACKEND_SECRET}
      baseUrl: https://backstage-demo-${RHDH_NAMESPACE}.${CLUSTER_DOMAIN}
      cors:
        origin: https://backstage-demo-${RHDH_NAMESPACE}.${CLUSTER_DOMAIN}
      
      actions:
        pluginSources:
          - software-catalog-mcp-tool
          - techdocs-mcp-tool
      externalAccess:
        - type: static
          options:
            token: ${MCP_TOKEN}
            subject: mcp-clients
      csp:
        upgrade-insecure-requests: false
        img-src:
          - "'self'"
          - "data:"
          - https://img.freepik.com
          - https://cdn.dribbble.com
          - https://avatars.githubusercontent.com
          - https://www.gravatar.com
          - https://issues.redhat.com

   
    # Proxy endpoints
    proxy:
      endpoints:
        '/jira/api':
          target: https://issues.redhat.com
          headers:
            Authorization: "Bearer ${JIRA_TOKEN}"
            Accept: 'application/json'
            Content-Type: 'application/json'
            X-Atlassian-Token: 'no-check'
            User-Agent: 'developer-hub'
        '/quay/api':
          target: 'https://quay.io'
          credentials: require
          headers:
            X-Requested-With: 'XMLHttpRequest'
            # Uncomment and use the Authorization header below to access a private Quay
            # Repository using a token. Refer to the "Applications and Tokens" section
            # at https://docs.quay.io/api/ to find the instructions to generate a token
            # Authorization: 'Bearer <YOUR TOKEN>'
          changeOrigin: true
          # Change to "false" in case of using self hosted quay instance with a self-signed certificate
          secure: true

    quay:
      # The UI url for Quay, used to generate the link to Quay
      uiUrl: 'https://quay.io'

    # Jira
    jira:
      proxyPath: "/jira/api"
      host: https://issues.redhat.com
      product: datacenter

   
    # GitHub App Authentication
    auth:
      environment: production
      providers:
        github:
          production:
            clientId: ${GITHUB_APP_CLIENT_ID}
            clientSecret: ${GITHUB_APP_CLIENT_SECRET}
         
    signInPage: github

    # GitHub App Integration
    integrations:
      github:
        - host: github.com
          apps:
            - appId: ${GITHUB_APP_ID}
              webhookUrl: ${GITHUB_APP_WEBHOOK_URL}
              clientId: ${GITHUB_APP_CLIENT_ID}
              clientSecret: ${GITHUB_APP_CLIENT_SECRET}
              webhookSecret: ${GITHUB_APP_WEBHOOK_SECRET}
              privateKey: |
                ${GITHUB_APP_PRIVATE_KEY}

    # Catalog configuration
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Group, User]
      providers:
        githubOrg:
          id: production
          githubUrl: https://github.com
          orgs:
            - ${GITHUB_ORG}
          schedule:
            initialDelay: { seconds: 15 }
            frequency:
              minutes: 30
            timeout:
              minutes: 3
      locations:
        # Register the demo template
        - type: url
          target: https://github.com/${GITHUB_ORG}/demo-templates/blob/main/template.yaml
          rules:
            - allow: [Template]

    # Kubernetes plugin configuration
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: ${OCP_API_URL}
              name: ocp
              authProvider: 'serviceAccount'
              skipTLSVerify: true
              skipMetricsLookup: true
              serviceAccountToken: ${OCP_SERVICE_ACCOUNT_TOKEN}
              customResources:
                - group: 'tekton.dev'
                  apiVersion: 'v1'
                  plural: 'pipelineruns'
                - group: 'tekton.dev'
                  apiVersion: 'v1'
                  plural: 'taskruns'
                - group: 'argoproj.io'
                  apiVersion: 'v1alpha1'
                  plural: 'rollouts'
                - group: 'route.openshift.io'
                  apiVersion: 'v1'
                  plural: 'routes'

    # ArgoCD plugin configuration
    argocd:
      username: ${ARGOCD_USERNAME}
      password: ${ARGOCD_PASSWORD}
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: https://openshift-gitops-server-${ARGOCD_NAMESPACE}.${CLUSTER_DOMAIN}
              username: ${ARGOCD_USERNAME}
              password: ${ARGOCD_PASSWORD}

    # TechDocs configuration
    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

    # Enabled features
    enabled:
      github: true
      githubOrg: true
      kubernetes: true
      argocd: true
      techdocs: true

